<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KrzysiowiceMC – serwer Minecraft</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'><rect width='10' height='10' fill='%23f9a81a'/><rect x='2' y='2' width='2' height='6' fill='%23fff'/><rect x='4' y='4' width='2' height='2' fill='%23fff'/><rect x='6' y='2' width='2' height='2' fill='%23fff'/><rect x='6' y='6' width='2' height='2' fill='%23fff'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f0e4; --sand:#fde6b0; --orange:#f9a81a; --orange-d:#e08e00;
  --ink:#2a2118; --muted:#7d7060; --card:#ffffff; --discord:#5865f2; --green:#4cd68a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Outfit",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:22px 48px}
nav{display:flex;gap:32px}
nav a{font-weight:700;color:var(--muted);letter-spacing:.02em;text-transform:uppercase;font-size:15px}
nav a.on,nav a:hover{color:var(--ink)}
.logo{width:56px;height:56px}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--orange);color:#fff;font-weight:800;text-transform:uppercase;font-size:14px;letter-spacing:.03em;padding:16px 28px;border-radius:12px;border:0;cursor:pointer;box-shadow:0 6px 0 var(--orange-d);transition:transform .1s,box-shadow .1s;font-family:inherit}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--orange-d)}
header .btn{justify-self:end}

.hero{display:grid;grid-template-columns:1fr 1.05fr;gap:40px;align-items:center;padding:30px 0 40px 0;background:linear-gradient(90deg,var(--sand) 0,var(--sand) 38%,var(--bg) 100%)}
.copy{padding:0 0 0 48px}
.tag{display:inline-flex;align-items:center;gap:8px;background:#fff8e6;border:1px solid #f3dca3;color:var(--orange-d);font-weight:700;padding:10px 16px;border-radius:10px;font-size:15px}
.tag svg{width:20px;height:20px}
h1{font-size:clamp(40px,5.6vw,76px);line-height:1.02;font-weight:800;margin:30px 0 40px;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--orange)}
.online{margin:22px 0 0 34px;color:var(--muted);font-size:15px;display:flex;align-items:center;gap:8px}
.online b{color:var(--ink)}
.dot{width:11px;height:11px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(76,214,138,.25)}
.copied{margin-left:12px;font-size:13px;color:var(--orange-d);font-weight:700;opacity:0;transition:opacity .2s}
.copied.show{opacity:1}

.art{position:relative;padding-right:48px}
.art svg.scene{width:100%;height:auto;display:block;image-rendering:pixelated;border-radius:6px}
.cards{display:grid;gap:16px;margin-top:-62px;position:relative;padding-left:0}
.card{background:var(--card);border-radius:14px;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 24px rgba(80,50,0,.08)}
.card small{display:block;color:var(--muted);font-size:13px;margin-bottom:4px}
.card strong{font-size:19px;color:var(--discord)}
.ico{width:48px;height:48px;border-radius:50%;background:var(--discord);display:grid;place-items:center}
.ico svg{width:26px;height:26px;fill:#fff}

/* bob animation of hero character, once on load */
.hero-char{animation:drop .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes drop{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 4s 2.5s infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:140%}}
/* animacja pisania */
h1 .w{display:inline-block;white-space:nowrap}
h1 .c{opacity:0}
h1 .c.on{opacity:1}
.caret{display:inline-block;width:0;height:.85em;border-left:.07em solid var(--ink);margin-left:.02em;vertical-align:-.05em;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.late{opacity:0;transition:opacity .7s}
.btn.late{transition:opacity .7s,transform .1s,box-shadow .1s}
.go .late{opacity:1}
/* grafika */
.cards{animation:slideIn .8s 1.2s cubic-bezier(.2,.9,.3,1) both}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.pick{transform-origin:112px 88px;animation:swing 2.4s 1.2s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}
.coin{animation:float 2.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px)}}
.sun{transform-origin:130px 18px;animation:pulse 4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.grains rect{fill:#fff3c4;opacity:.8;animation:drift 7s linear infinite}
@keyframes drift{from{transform:translateX(-10px)}to{transform:translateX(170px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.late{opacity:1}html{scroll-behavior:auto}}

footer{text-align:center;color:var(--muted);font-size:14px;padding:30px 20px 40px}

@media (max-width:900px){
  header{grid-template-columns:auto 1fr;padding:16px 20px}
  header .logo{order:-1}
  header nav{display:none}
  header .btn{padding:12px 18px;font-size:12px}
  .hero{grid-template-columns:1fr;background:var(--sand);padding:30px 0}
  .copy{padding:0 20px}
  .art{padding:0 20px}
  .cards{margin-top:16px}
}
</style>
</head>
<body>
<noscript><style>.late{opacity:1!important}h1 .c{opacity:1}</style></noscript>

<header>
  <nav>
    <a href="#" class="on">Strona główna</a>
    <a href="#sklep">Sklep</a>
    <a href="#regulamin">Regulamin</a>
  </nav>
  <a href="#" aria-label="KrzysiowiceMC">
    <!-- logo: pikselowy blok z literą K -->
    <svg class="logo" viewBox="0 0 16 16" shape-rendering="crispEdges">
      <rect width="16" height="16" fill="#7a4a1c"/>
      <rect x="1" y="1" width="14" height="14" fill="#f9a81a"/>
      <rect x="1" y="1" width="14" height="2" fill="#ffc83d"/>
      <rect x="1" y="13" width="14" height="2" fill="#e08e00"/>
      <rect x="4" y="4" width="2" height="8" fill="#2a2118"/>
      <rect x="6" y="7" width="2" height="2" fill="#2a2118"/>
      <rect x="8" y="5" width="2" height="2" fill="#2a2118"/>
      <rect x="10" y="4" width="2" height="2" fill="#2a2118"/>
      <rect x="8" y="9" width="2" height="2" fill="#2a2118"/>
      <rect x="10" y="10" width="2" height="2" fill="#2a2118"/>
    </svg>
  </a>
  <a class="btn" href="#sklep">Sklep serwera</a>
</header>

<main>
<section class="hero">
  <div class="copy">
    <span class="tag">
      <svg viewBox="0 0 16 16" shape-rendering="crispEdges"><rect width="16" height="16" fill="#f9a81a"/><rect x="4" y="4" width="2" height="8" fill="#fff"/><rect x="6" y="7" width="2" height="2" fill="#fff"/><rect x="8" y="5" width="2" height="2" fill="#fff"/><rect x="10" y="4" width="2" height="2" fill="#fff"/><rect x="8" y="9" width="2" height="2" fill="#fff"/><rect x="10" y="10" width="2" height="2" fill="#fff"/></svg>
      KrzysiowiceMC
    </span>
    <h1 id="title" aria-label="Zagraj na prawdziwej piaskowej krainie!">Zagraj na prawdziwej <em>piaskowej</em> krainie!</h1>
    <button class="btn late" id="copy" type="button">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="#fff"><path d="M3 1l9 6-9 6z"/></svg>
      Skopiuj IP serwera
    </button><span class="copied" id="copied" role="status">Skopiowano!</span>
    <p class="online late"><span class="dot"></span><span id="count"><b>–</b> osób jest w trakcie gry</span></p>
  </div>

  <div class="art">
    <!-- grafika: pikselowa kraina piasku -->
    <svg class="scene" viewBox="0 0 160 110" shape-rendering="crispEdges" role="img" aria-label="Pikselowa postać z koroną na pustyni">
      <rect width="160" height="110" fill="#fdb41c"/>
      <rect y="0" width="160" height="40" fill="#fdbf3a"/>
      <g class="sun">
      <rect x="120" y="8" width="20" height="20" fill="#fff3c4"/>
      <rect x="124" y="4" width="12" height="28" fill="#fff3c4"/>
      <rect x="116" y="12" width="28" height="12" fill="#fff3c4"/></g>
      <!-- piksele tła -->
      <rect x="0" y="20" width="10" height="10" fill="#fed06a"/>
      <rect x="10" y="40" width="10" height="10" fill="#fed06a"/>
      <rect x="0" y="60" width="10" height="10" fill="#fff0c9"/>

        <rect x="0" y="84" width="2" height="2" style="animation-delay:-2s;animation-duration:8s"/>

      </g>
      <!-- wydmy -->
      <rect y="78" width="160" height="32" fill="#f2a014"/>
      <rect x="0" y="72" width="60" height="6" fill="#f2a014"/>
      <rect x="0" y="66" width="30" height="6" fill="#f2a014"/>

      <rect x="130" y="64" width="30" height="6" fill="#f2a014"/>
      <rect y="94" width="160" height="16" fill="#e08e00"/>
      <!-- kaktus -->
      <rect x="18" y="52" width="8" height="30" fill="#3f9b4a"/>
      <rect x="10" y="58" width="8" height="6" fill="#3f9b4a"/>
      <rect x="10" y="52" width="4" height="8" fill="#3f9b4a"/>
      <rect x="26" y="62" width="8" height="6" fill="#3f9b4a"/>
      <rect x="30" y="56" width="4" height="8" fill="#3f9b4a"/>
      <rect x="18" y="52" width="3" height="30" fill="#56b861"/>
      <g class="coin">
      <rect x="40" y="30" width="14" height="14" fill="#ffd34e"/>
      <rect x="43" y="33" width="8" height="8" fill="#f2a014"/>
      <rect x="46" y="35" width="2" height="4" fill="#ffd34e"/></g>
      <!-- postać -->
      <g class="hero-char">
        <!-- korona -->
        <rect x="64" y="22" width="32" height="8" fill="#ffd34e"/>
        <rect x="64" y="14" width="6" height="8" fill="#ffd34e"/>
        <rect x="77" y="10" width="6" height="12" fill="#ffd34e"/>

        <rect x="78" y="24" width="4" height="4" fill="#5fd4c8"/>
        <!-- głowa -->
        <rect x="64" y="30" width="32" height="26" fill="#e9b07c"/>

        <rect x="74" y="50" width="12" height="3" fill="#b9753f"/>

        <rect x="62" y="56" width="36" height="28" fill="#e8531c"/>

        <!-- kilof --><g class="pick">
        <rect x="110" y="40" width="4" height="48" fill="#7a4a1c"/>
        <rect x="100" y="34" width="28" height="6" fill="#5fd4c8"/>

    <div class="cards">
      <a class="card" href="https://dc.krzysiowicemc.cc.cd" target="_blank" rel="noopener">
        <div><small>Dołącz na serwer</small><strong>dc.krzysiowicemc.cc.cd</strong></div>
        <span class="ico" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.3.5a13 13 0 0 1 3.7 1.8 16 16 0 0 0-13.6 0A13 13 0 0 1 8.9 3.5L8.6 3a19.8 19.8 0 0 0-4.9 1.4C.6 9 0 13.5.3 18a20 20 0 0 0 6 3l1.3-2.1a13 13 0 0 1-2-1l.5-.4a14.3 14.3 0 0 0 12.2 0l.5.4a13 13 0 0 1-2 1l1.3 2.1a20 20 0 0 0 6-3c.4-5.200-.7-9.700-3.800-13.600zM8.500 15.300c-1.200 0-2.100-1.100-2.100-2.400s.9-2.400 2.100-2.400 2.100 1.100 2.100 2.400-.9 2.400-2.100 2.400zm7 0c-1.200 0-2.100-1.100-2.100-2.400s.9-2.400 2.100-2.400 2.100 1.100 2.100 2.400-.9 2.400-2.100 2.400z"/></svg>

</main>

<footer>© 2026 KrzysiowiceMC</footer>

<script>
  const IP = "krzysiowicemc.cc.cd";
  const btn = document.getElementById("copy"), note = document.getElementById("copied");
  btn.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(IP); }
    catch (e) {
      const t = document.createElement("textarea"); t.value = IP; document.body.appendChild(t);
      t.select(); document.execCommand("copy"); t.remove();
    }
    note.classList.add("show"); setTimeout(() => note.classList.remove("show"), 1800);
  });

  // Animacja pisania nagłówka
  (function(){
    const h=document.getElementById("title"), full="Zagraj na prawdziwej piaskowej krainie!";
    const s=full.indexOf("piaskowej"), e=s+"piaskowej".length;
    h.textContent="";
    const chars=[]; let i=0;
    full.split(" ").forEach((word,wi,arr)=>{
      const w=document.createElement("span"); w.className="w"; w.setAttribute("aria-hidden","true");
      [...word].forEach(ch=>{
        const c=document.createElement("span"); c.className="c"; c.textContent=ch;
        if(i>=s&&i<e) c.style.color="var(--orange)";
        w.appendChild(c); chars.push(c); i++;
      });
      h.appendChild(w);
      if(wi<arr.length-1){h.appendChild(document.createTextNode(" ")); i++;}
    });
    const caret=document.createElement("span"); caret.className="caret";
    const done=()=>{document.querySelector(".copy").classList.add("go"); setTimeout(()=>caret.remove(),2500);};
    if(matchMedia("(prefers-reduced-motion: reduce)").matches){chars.forEach(c=>c.classList.add("on"));done();return;}
    let n=0; chars[0].before(caret);
    const step=()=>{
      chars[n].classList.add("on"); n++;
      if(n<chars.length){chars[n].before(caret); setTimeout(step,55+Math.random()*60);}
      else{chars[n-1].after(caret); done();}
    };
    setTimeout(step,600);
  })();

  // Licznik graczy – płynne dobijanie do liczby
  function countUp(to){
    const b=document.querySelector("#count b"), t0=performance.now(), d=1400;
    (function f(t){const p=Math.min((t-t0)/d,1); b.textContent=Math.round(to*(1-Math.pow(1-p,3))); if(p<1)requestAnimationFrame(f);})(t0);
  }

  // Licznik graczy z publicznego API (jeśli serwer jest online)
  fetch("https://api.mcsrvstat.us/3/" + IP)
    .then(r => r.json())
    .then(d => {
      if (d && d.online && d.players) {
        countUp(d.players.online);
      } else {
        document.getElementById("count").innerHTML = "Serwer chwilowo offline";
      }
    })
    .catch(() => {});
</script>
</body>
</html>
